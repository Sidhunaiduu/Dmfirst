<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:#070707;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
overflow-x:hidden;
}

body:before,
body:after{
content:"";
position:fixed;
width:380px;
height:380px;
border-radius:50%;
filter:blur(100px);
pointer-events:none;
}

body:before{
background:rgba(255,255,255,.07);
top:-180px;
left:-150px;
}

body:after{
background:rgba(180,180,180,.06);
bottom:-180px;
right:-150px;
}

.container{
width:100%;
max-width:420px;
position:relative;
z-index:2;
}

.card{
position:relative;
overflow:hidden;
text-align:center;
padding:35px 25px 27px;
border-radius:25px;
background:linear-gradient(145deg,#191919,#090909 65%);
border:1px solid rgba(255,255,255,.19);
box-shadow:0 25px 80px rgba(0,0,0,.8);
animation:cardIn .9s ease;
}

.card:before{
content:"";
position:absolute;
top:0;
left:12%;
width:76%;
height:1px;
background:linear-gradient(90deg,transparent,#fff,transparent);
}

.badge{
display:inline-block;
padding:9px 17px;
border:1px solid #555;
border-radius:30px;
color:#ddd;
font-size:10px;
font-weight:900;
letter-spacing:2px;
margin-bottom:27px;
}

.logo{
width:115px;
height:115px;
object-fit:cover;
border-radius:50%;
padding:4px;
border:2px solid #aaa;
margin-bottom:23px;
box-shadow:0 0 30px rgba(255,255,255,.15);
animation:logoGlow 3s infinite alternate;
}

h1{
font-size:30px;
font-weight:1000;
letter-spacing:2px;
color:#fff;
margin-bottom:13px;
text-shadow:0 0 20px rgba(255,255,255,.15);
}

.subtitle{
font-size:12px;
font-weight:800;
letter-spacing:1.5px;
line-height:1.9;
color:#aaa;
margin-bottom:25px;
}

.divider{
width:65px;
height:2px;
margin:0 auto 27px;
background:linear-gradient(90deg,transparent,#fff,transparent);
}

.stats{
display:flex;
gap:10px;
margin-bottom:29px;
}

.stat{
flex:1;
padding:16px 5px;
background:linear-gradient(145deg,#202020,#101010);
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
}

.stat h2{
font-size:21px;
font-weight:1000;
color:#fff;
margin-bottom:7px;
}

.stat p{
font-size:9px;
font-weight:900;
letter-spacing:1.2px;
color:#999;
}

.join-btn{
width:100%;
min-height:57px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
border-radius:13px;
background:linear-gradient(110deg,#fff,#c7c7c7);
color:#080808;
text-decoration:none;
font-size:14px;
font-weight:1000;
letter-spacing:1.5px;
box-shadow:0 10px 30px rgba(255,255,255,.12);
transition:.3s ease;
}

.join-btn:hover{
transform:translateY(-4px);
box-shadow:0 15px 35px rgba(255,255,255,.2);
}

.join-btn:active{
transform:scale(.96);
}

.join-btn svg{
width:22px;
height:22px;
}

.footer{
margin-top:25px;
font-size:10px;
font-weight:800;
letter-spacing:2px;
color:#666;
}

@keyframes cardIn{
from{
opacity:0;
transform:translateY(25px) scale(.97);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

@keyframes logoGlow{
from{
box-shadow:0 0 12px rgba(255,255,255,.08);
}
to{
box-shadow:0 0 30px rgba(255,255,255,.25);
}
}

@media(max-width:380px){
.card{
padding:28px 18px 23px;
}
h1{
font-size:25px;
}
.logo{
width:100px;
height:100px;
}
}
</style>
